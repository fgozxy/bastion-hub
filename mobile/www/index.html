<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" />
  <title>NodePanel</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #faf9f5; color: #2d2a26;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .box { text-align: center; padding: 24px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 16px;
      display: grid; place-items: center;
      font: 700 32px system-ui, sans-serif; color: #fff;
      background: linear-gradient(135deg, #8b8680, #7f7a74);
      box-shadow: 0 8px 24px rgba(45, 42, 38, 0.12);
    }
    p { opacity: .7; line-height: 1.5; margin: 0; color: #6d6760; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: .02em; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">N</div>
    <h1>NodePanel</h1>
    <p>正在连接管理面板…<br />https://panel.example.com</p>
  </div>
</body>
</html>
