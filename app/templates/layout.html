<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bastion Hub{% endblock %}</title>
    <style>
        :root { --bg:#0f1117; --card:#161922; --border:#2a2e3a; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --danger:#f85149; --ok:#3fb950; --warn:#d29922; }
        * { box-sizing:border-box; }
        body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
        a { color:var(--accent); text-decoration:none; }
        a:hover { text-decoration:underline; }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
        header h1 { margin:0; font-size:18px; }
        nav a { margin-left:16px; font-size:14px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
        .stat { font-size:28px; font-weight:600; }
        .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); }
        th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
        .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:12px; font-weight:500; }
        .badge-online { background:rgba(63,185,80,.15); color:var(--ok); }
        .badge-offline { background:rgba(248,81,73,.15); color:var(--danger); }
        .badge-pending { background:rgba(210,153,34,.15); color:var(--warn); }
        .badge-disabled { background:rgba(139,148,158,.15); color:var(--muted); }
        .btn { display:inline-block; padding:6px 14px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:14px; }
        .btn:hover { background:var(--border); }
        .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
        .btn-primary:hover { opacity:.9; }
        .btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        pre { background:#0d1117; padding:12px; border-radius:6px; overflow:auto; font-size:13px; border:1px solid var(--border); }
        form input, form select { background:var(--bg); color:var(--text); border:1px solid var(--border); padding:8px 10px; border-radius:6px; font-size:14px; width:100%; }
        form label { display:block; margin-bottom:4px; font-size:13px; color:var(--muted); }
        .form-row { margin-bottom:12px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <h1><a href="/dashboard">Bastion Hub</a></h1>
        <nav>
            <a href="/dashboard">仪表盘</a>
            <a href="/nodes">节点</a>
            <a href="/policies">策略</a>
            <a href="/credentials">凭证</a>
            <a href="/jobs">任务</a>
            <a href="/settings">设置</a>
            <a href="/api/auth/logout">退出登录</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
